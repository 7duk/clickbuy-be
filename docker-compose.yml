services:
  mysql:
    image: mysql:latest
    container_name: sd-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sideproject
    ports:
      - "3308:3306"
    restart: unless-stopped
    volumes:
      - backend_volume:/var/lib/mysql
    networks:
      - backend_network

#  app:
#    container_name: app
#    build:
#      context: .
#      dockerfile: docker/app/Dockerfile
#    ports:
#      - "8888:8080"
#    env_file:
#      - env
#    restart: unless-stopped
#    networks:
#      - backend_network
#    depends_on:
#      - mysql

  rabbit_mq:
    image: rabbitmq:3-management
    container_name: sd-rabbit_mq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: rabbit
      RABBITMQ_DEFAULT_PASS: pass
    restart: unless-stopped
    networks:
      - backend_network

  mongodb:
    image: mongo:latest
    container_name: sd-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - backend_network

  logstash:
    image: logstash:7.14.1
    container_name: sd-logstash
    ports:
      - "5600:5600"
      - "5044:5044"
    environment:
      - XPACK_MONITORING_ELASTICSEARCH_HOSTS=http://elastic-search:9200
      - XPACK_MONITORING_ENABLED=true
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    restart: unless-stopped
    networks:
      - backend_network

  elastic-search:
    image: elasticsearch:7.14.1
    container_name: sd-elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
    restart: unless-stopped
    networks:
      - backend_network

  kibana:
    image: kibana:7.14.1
    container_name: sd-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elastic-search:9200
    restart: unless-stopped
    networks:
      - backend_network

  prometheus:
    image: prom/prometheus
    container_name: sd-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    container_name: sd-grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=password
    volumes:
      - grafana:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
    backend_volume:
    mongo-data:
    grafana:

networks:
    backend_network:


